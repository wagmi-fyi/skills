# orchestrate skill configuration — per-machine / per-org. Safe to edit.

# Where generated project artifacts (plan.md + workpaper.md) are written.
#   - absolute path, OR relative to the orchestrator's working dir / repo root
#   - leave BLANK to have `bootstrap` establish it from repo conventions + confirm
#   - this default ships blank ON PURPOSE — an org/repo-specific dir is a convention, not a default
output_dir: ""              # examples: "docs/orchestrations"  |  ".orchestrations"  |  "/abs/path"

# Bus data location (machine-level; the bus CLI also honors $SESSION_BUS_DIR).
bus_dir: "~/.claude/session-bus"

# The bus that every account on this machine joins, where one exists. It sits
# outside every home, group-owned and group-writable. `desktop-wake --check`
# reports it so a session can tell the shared rail from a private one. Leave
# BLANK where one person works alone: there is no shared bus then, and the bus
# under their home is the only one.
shared_bus: ""

# Which substrate runbook describes this machine: one of reference/substrates/<name>.md.
# It decides how a delegate is started, addressed, watched, woken and retired. A run
# records its own substrate in the workpaper, and that record wins over this default.
# Leave BLANK to have detection answer, which is what it ships as: `spawn --check`
# then names what it found and asks you to record it, and refuses when nothing here
# can spawn at all. Declare one only when detection is wrong or you want it pinned.
substrate: ""

# Who starts a delegate session:
#   "auto-spawn" — the orchestrator runs scripts/spawn, which uses the substrate's branch
#   "manual"     — the human opens the session; the orchestrator addresses it once it is listed
spawn_mode: "auto-spawn"

# Launch spawned delegates with permission prompts bypassed, so they don't stall unseen
# (matches an operator who works that way). A general/shared deployment ships this
# FALSE — it's a security bypass; opt in deliberately, per machine.
delegate_skip_permissions: false

# Model for spawned delegate sessions. Delegates run charters written for a specific
# model's dispositions; without this, a spawn inherits whatever default the human last
# saved for their own sessions. Blank = inherit, which is what it ships as. Set it once
# you know which model your charters are written for, because a charter that assumes a
# model's dispositions and gets another one fails quietly rather than loudly.
delegate_model: ""
