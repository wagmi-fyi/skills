# Fiscal Calendar Definition
# Created during onboarding for clients using fiscal (non-calendar-monthly) periods.
# Referenced by config.yaml: fiscal_calendar: "{local_dir}/content/period-close/fiscal-calendar.yaml"
#
# Usage: Copy this template, fill in all periods for the fiscal year.
# The period resolver looks up periods by 'id' field (e.g., "2026-P01").
# Dates MUST be quoted strings ("YYYY-MM-DD") to prevent YAML date parsing.

fiscal_year: 2026
calendar_type: "13-period"        # "13-period" (uniform 4-week) or "4-4-5" (quarterly variant)
week_start_day: "sunday"          # "sunday" or "monday"
fiscal_year_start: "2026-01-04"
fiscal_year_end: "2027-01-02"

periods:
  - id: "2026-P01"
    period: 1
    start_date: "2026-01-04"
    end_date: "2026-01-31"
    weeks: [1, 2, 3, 4]

  - id: "2026-P02"
    period: 2
    start_date: "2026-02-01"
    end_date: "2026-02-28"
    weeks: [5, 6, 7, 8]

